name: metin2-godotime
services:
  db:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:13210:3000"
    volumes:
      - world:/data
    mem_limit: 2g
    cpus: 2
    logging:
      options: {max-size: "10m", max-file: "3"}
  auth:
    build: ./auth
    restart: unless-stopped
    environment:
      AUTH_HOST: 0.0.0.0
      AUTH_PORT: 3219
      AUTH_DATA_DIR: /data
      AUTH_ISSUER: ${AUTH_ISSUER:-https://kcanakdag.com:8443/auth}
      AUTH_TRUST_PROXY: "true"
    volumes:
      - accounts:/data
    mem_limit: 512m
    cpus: 1
    logging:
      options: {max-size: "10m", max-file: "3"}
  web:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    ports:
      - "${GAME_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/srv/game:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    mem_limit: 256m
    cpus: 1
    depends_on: [db, auth]
    logging:
      options: {max-size: "10m", max-file: "3"}
volumes:
  world:
  accounts:
